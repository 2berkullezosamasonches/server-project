name: Windows Gothic Tray App CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S tray_app -B tray_app/build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build tray_app/build --config Release

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: GothicTrayKeeper-windows-x64
          path: tray_app/build/Release/GothicTrayKeeper.exe
