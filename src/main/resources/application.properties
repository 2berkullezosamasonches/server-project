spring.application.name=warehouse-manager

# 1. ??????????? ? ???? ?????? PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. ????????? Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.default-property-inclusion=non_null

# 3. ????????? ?????????
spring.sql.init.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# 4. ???????????? ? JWT
spring.main.allow-bean-definition-overriding=true
jwt.secret=${JWT_SECRET}
jwt.access.expiration=900000
jwt.refresh.expiration=604800000

# 5. ????????? HTTPS (SSL/TLS)
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=keystore.p12
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
server.ssl.key-alias=server-alias
server.ssl.key-password=${KEY_PASSWORD}

# 6. ????????? ?????? ??? (RSA)
signature.keystore.path=keystore.p12
signature.keystore.password=${KEYSTORE_PASSWORD}
signature.key.alias=server-alias
signature.key.password=${KEY_PASSWORD}