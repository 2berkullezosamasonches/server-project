version: "3.9"

services:
  minio:
    image: minio/minio:latest
    container_name: warehouse-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: warehouse-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${MINIO_BUCKET} || true;
      mc anonymous set none local/${MINIO_BUCKET} || true;
      mc admin user add local ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} || true;
      mc admin policy attach local readwrite --user ${MINIO_ACCESS_KEY} || true;
      exit 0;
      "

volumes:
  minio_data: