version: "3.9"

services:
  minio:
    image: minio/minio:latest
    container_name: warehouse-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio-root
      MINIO_ROOT_PASSWORD: minio-root-password
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: warehouse-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minio-root minio-root-password;
      mc mb -p local/signature-files;
      mc anonymous set none local/signature-files;
      mc admin user add local app-access-key app-secret-key-12345;
      mc admin policy attach local readwrite --user app-access-key;
      exit 0;
      "

volumes:
  minio_data: